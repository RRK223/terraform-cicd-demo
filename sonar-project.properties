# --- 1. PROJECT IDENTIFICATION ---
# This must match the "Project Key" you created in the SonarQube UI
sonar.projectKey=Test.cicd

# The name that will appear in the SonarQube dashboard
sonar.projectName=Test
sonar.projectVersion=1.0


# --- 2. SOURCE CONFIGURATION ---
# Tells SonarQube to start scanning from the current directory
sonar.sources=.

# Encoding of the source files
sonar.sourceEncoding=UTF-8


# --- 3. TERRAFORM SPECIFIC SETTINGS ---
# Ensures the scanner recognizes .tf files
sonar.terraform.file.suffixes=.tf

# If you have a 'modules' or 'environments' folder, make sure they are included
# Use exclusions to skip things like the .terraform internal folder or state files
sonar.exclusions=**/.terraform/**, **/terraform.tfstate, **/node_modules/**


# --- 4. QUALITY & SECURITY ---
# This helps SonarQube categorize your code correctly for security hotspots
sonar.smells.enable=true
